audiogram_types_criteria_zone_1:
  Resztki_sluchowe:
    conditions:
      - column: "hfPTA"
        operator: ">"
        value: 120
        
  Wznoszacy:
    conditions:
      - columns: ["lfPTA_1", "hfPTA"]
        operation: "diff"   
        operator: ">="
        value: 10

  Stromo_opadajacy:
    conditions:
      - columns: ["hfPTA", "lfPTA_1"]
        operation: "diff"
        operator: ">="
        value: 25

  Rownomiernie_opadajacy:
    conditions:
      - columns: ["hfPTA", "lfPTA_1"]
        operation: "diff"
        operator: ">="
        value: 10
      - columns: ["hfPTA", "lfPTA_1"]
        operation: "diff"
        operator: "<"
        value: 25

  U_ksztaltny:
    conditions:
      - columns: ["PTA2", "lfPTA_1"]
        operation: "diff"
        operator: ">="
        value: 15
      - columns: ["PTA2", "hfPTA"]
        operator: ">="
        value: 15

  Plaski:
    conditions:
      - columns: ["lfPTA_1", "PTA2"]
        operation: "diff"
        operator: "abs<="
        value: 10
      - columns: ["PTA2", "hfPTA"]
        operation: "diff"
        operator: "abs<="
        value: 10
        


audiogram_types_criteria_zone_2:
  Resztki_sluchowe:
    conditions:
      - column: "hfPTA"
        operator: ">"
        value: 120

  Wznoszacy:
    conditions:
      - columns: ["lfPTA_2", "hfPTA"]
        operation: "diff"   
        operator: ">="
        value: 10

  Stromo_opadajacy:
    conditions:
      - columns: ["hfPTA", "lfPTA_2"]
        operation: "diff"
        operator: ">="
        value: 25

  Rownomiernie_opadajacy:
    conditions:
      - columns: ["hfPTA", "lfPTA_2"]
        operation: "diff"
        operator: ">="
        value: 10
      - columns: ["hfPTA", "lfPTA_2"]
        operation: "diff"
        operator: "<"
        value: 25

  U_ksztaltny:
    conditions:
      - columns: ["PTA4", "lfPTA_2"]
        operation: "diff"
        operator: ">="
        value: 15
      - columns: ["PTA4", "hfPTA"]
        operator: ">="
        value: 15

  Plaski:
    conditions:
      - columns: ["lfPTA_2", "PTA4"]
        operation: "diff"
        operator: "abs<="
        value: 10
      - columns: ["PTA4", "hfPTA"]
        operation: "diff"
        operator: "abs<="
        value: 10
        
audiogram_types_criteria_zones:
  Resztki_sluchowe:
    condition_and_columns:
      - columns: {"WYNIK_X_125": 70, "WYNIK_X_250": 70,
                "WYNIK_X_4000": 100, "WYNIK_X_8000": 100}
        operator: ">="

  Wznoszacy:
    condition_or_columns: 
      - columns: {"WYNIK_X_125": 70, "WYNIK_X_250": 70,
                "WYNIK_X_4000": 100, "WYNIK_X_8000": 100}
        operator: "<"

    condition_and:
      - columns: ["lf_zone_PTA", "hf_zone_PTA"] 
        operator: ">="
        value: 10

  Rownomiernie_opadajacy:
    condition_or_columns: 
      - columns: {"WYNIK_X_125": 70, "WYNIK_X_250": 70,
                "WYNIK_X_4000": 100, "WYNIK_X_8000": 100}
        operator: "<"
    condition_and:
      - columns: ["hf_zone_PTA", "lf_zone_PTA"]
        operator: ">="
        value: 10
      - columns: ["hf_zone_PTA", "lf_zone_PTA"]
        operator: "<"
        value: 25

  Stromo_opadajacy:
    condition_or_columns: 
      - columns: {"WYNIK_X_125": 70, "WYNIK_X_250": 70,
                "WYNIK_X_4000": 100, "WYNIK_X_8000": 100}
        operator: "<"
    condition_and:
      - columns: ["hf_zone_PTA", "lf_zone_PTA"]
        operator: ">="
        value: 25

  U_ksztaltny:
    condition_or_columns: 
      - columns: {"WYNIK_X_125": 70, "WYNIK_X_250": 70,
                "WYNIK_X_4000": 100, "WYNIK_X_8000": 100}
        operator: "<"
    condition_or_and:
      - name: cond1
        conditions:
          - columns: ["lf_zone_PTA", "hf_zone_PTA"]
            operator: "<"
            value: 10
          - columns: ["hf_zone_PTA", "lf_zone_PTA"]
            operator: "<"
            value: 10
      - name: cond2
        conditions:
          - columns: ["mf_zone_PTA", "lf_zone_PTA"]
            operator: ">="
            value: 10
          - columns: ["mf_zone_PTA", "hf_zone_PTA"]
            operator: ">="
            value: 10

  Plaski:
    condition_or_columns: 
      - columns: {"WYNIK_X_125": 70, "WYNIK_X_250": 70,
                "WYNIK_X_4000": 100, "WYNIK_X_8000": 100}
        operator: "<"
    condition_or_and:
      - name: cond1
        conditions:
          - columns: ["lf_zone_PTA", "hf_zone_PTA"]
            operator: "<"
            value: 10
          - columns: ["hf_zone_PTA", "lf_zone_PTA"]
            operator: "<"
            value: 10
    condition_and:
      - columns: ["mf_zone_PTA", "lf_zone_PTA"]
        operator: "abs<"
        value: 10
      - columns: ["mf_zone_PTA", "hf_zone_PTA"]
        operator: "abs<"
        value: 10    

  N_ksztaltny:
    condition_or_columns: 
      - columns: {"WYNIK_X_125": 70, "WYNIK_X_250": 70,
                "WYNIK_X_4000": 100, "WYNIK_X_8000": 100}
        operator: "<"
    condition_or_and:
      - name: cond1
        conditions:
          - columns: ["lf_zone_PTA", "hf_zone_PTA"]
            operator: "<"
            value: 10
          - columns: ["hf_zone_PTA", "lf_zone_PTA"]
            operator: "<"
            value: 10
      - name: cond2
        conditions:
          - columns: ["mf_zone_PTA", "lf_zone_PTA"]
            operator: "<="
            value: -10
          - columns: ["mf_zone_PTA", "hf_zone_PTA"]
            operator: "<="
            value: -10    

